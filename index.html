<head>

<title>Menu</title>
<link rel="stylesheet" href="style.css">

<body>
<header>

<nav id="nav"></nav>

</main>

<footer>

  <p>Onofficieel menu, overgenomen van de bestelzuil<span id="updated"></span>. Prijzen kunnen afwijken.</p>
</footer>
