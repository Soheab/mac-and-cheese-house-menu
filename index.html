<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111111">
<title>Menu</title>
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <p id="subtitle">Menukaart</p>
  <p id="location" hidden><a id="location-link" target="_blank" rel="noopener"></a></p>
</header>

<div id="toolbar">
  <input id="search" type="search" placeholder="Zoeken…" autocomplete="off" aria-label="Zoek op het menu">
  <nav id="nav"></nav>
</div>

<main id="menu">
  <p class="status">Menu laden…</p>
</main>

<footer>
  <p id="footer-note"></p>
  <p>Onofficieel menu, overgenomen van de bestelzuil<span id="updated"></span>. Prijzen kunnen afwijken.</p>
</footer>

<button id="cart-bar" type="button" hidden>
  <span>Winkelwagen · <span id="cart-count"></span></span>
  <strong id="cart-bar-total"></strong>
</button>

<dialog id="cart" aria-labelledby="cart-title">
  <div class="cart-head">
    <h2 id="cart-title">Winkelwagen</h2>
    <button id="cart-close" type="button" class="icon" aria-label="Sluiten">✕</button>
  </div>
  <p class="note">Alleen om te rekenen. Je kunt hier niet bestellen.</p>
  <ul id="cart-lines"></ul>
  <p class="cart-total"><span>Totaal</span><strong id="cart-total"></strong></p>
  <button id="cart-clear" type="button" class="secondary">Leegmaken</button>
</dialog>

<dialog id="lightbox" aria-label="Foto">
  <img id="lightbox-img" alt="">
  <p id="lightbox-caption"></p>
  <span class="hint">Tik om te sluiten</span>
</dialog>
</body>
</html>
